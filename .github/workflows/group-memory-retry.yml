name: Group memory retry tests
on:
  push:
    branches: ["fix/group-turn-memory-retry"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false --no-save @deepseek-ai/schemastery yaml
      - run: npm test
